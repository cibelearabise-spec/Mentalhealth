<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Meditação - Tela Inicial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Importação das fontes: Plus Jakarta Sans para o corpo e Great Vibes para o estilo caligráfico -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-script { font-family: 'Great Vibes', cursive; }
  </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">

  <!-- Container do Smartphone -->
  <div class="relative w-[390px] h-[844px] bg-black rounded-[45px] overflow-hidden shadow-2xl border-[8px] border-slate-800">

    <!-- Tela Inicial (Home) -->
    <div id="screen-home" class="relative w-full h-full flex flex-col justify-between p-6 overflow-hidden">
      
      <!-- Fundo: A sua foto exata + Gradiente idêntico ao original -->
      <div class="absolute inset-0 z-0">
        <!-- Certifique-se de que a imagem está na raiz do repositório como 'fundo.jpg' -->
        <img src="fundo.jpg" 
             alt="Double Exposure Background" 
             class="w-full h-full object-cover object-center">
        
        <!-- Gradiente customizado: suave no topo, escuro e profundo embaixo para destacar perfeitamente os textos -->
        <div class="absolute inset-0 bg-gradient-to-t from-[#0c0a15] via-[#0c0a15]/50 to-transparent"></div>
      </div>

      <!-- Header: Botões de navegação e menu superior -->
      <div class="relative z-10 flex justify-between items-center pt-8">
        <button class="w-11 h-11 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center text-white/90 border border-white/15 hover:bg-black/30 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button class="w-11 h-11 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center text-white/90 border border-white/15 hover:bg-black/30 transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
        </button>
      </div>

      <!-- Conteúdo Inferior: Tags, Títulos em Caligrafia e Botão Play -->
      <div class="relative z-10 pb-4">
        
        <!-- Tags de Categorias e Curtidas -->
        <div class="flex items-center gap-2.5 mb-4">
          <span class="px-4 py-1.5 rounded-full bg-white/15 backdrop-blur-md text-white text-xs font-medium flex items-center gap-1.5 border border-white/20">
            🌿 Calma
          </span>
          <span class="px-3.5 py-1.5 rounded-full bg-black/30 backdrop-blur-md text-white text-xs font-medium flex items-center gap-1 border border-white/15">
            ❤️ 104
          </span>
          <span class="px-3.5 py-1.5 rounded-full bg-black/30 backdrop-blur-md text-white text-xs font-medium flex items-center gap-1 border border-white/15">
            🔖 85
          </span>
        </div>

        <!-- Título principal com estilo caligráfico e em português -->
        <h1 class="text-4xl text-white leading-[1.1] mb-3 tracking-wide drop-shadow-md">
          Respiração profunda<br>para <span class="font-script text-5xl text-rose-200 font-normal">Relaxamento</span>
        </h1>

        <!-- Descrição em Português -->
        <p class="text-white/80 text-sm leading-relaxed mb-6 font-light drop-shadow">
          Siga um ritmo simples de respiração para relaxar os músculos e acalmar os pensamentos. Perfeito para uma pausa curta ou antes de dormir.
        </p>

        <!-- Barra de Ações Inferior -->
        <div class="flex items-center gap-3">
          <button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white border border-white/20 hover:bg-white/20 transition">
            ✕
          </button>
          <button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white border border-white/20 hover:bg-white/20 transition">
            🔗
          </button>
          <button class="flex-1 py-4 bg-white text-slate-900 rounded-full font-medium flex items-center justify-center gap-3 shadow-xl hover:bg-slate-100 transition">
            Reproduzir agora 
            <span class="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">▶</span>
          </button>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
